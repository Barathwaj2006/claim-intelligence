version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: claim-intelligence-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: claim_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: claim-intelligence-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/claim_intelligence
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: claim-intelligence-web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
